<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge — Graduate Credential Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f5f5f5; }
    ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
    .card-hover { transition: box-shadow 0.2s ease, transform 0.2s ease; }
    .card-hover:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.09); transform: translateY(-1px); }
    .btn-t { transition: all 0.15s ease; }
    .nav-item { transition: background 0.12s ease; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .progress-bar { transition: width 0.6s ease; }
  </style>
</head>
<body class="bg-white text-black">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ── ICONS ───────────────────────────────────────────────── */
const Ico = ({ n, s = 20, cls = '' }) => {
  const p = {
    home:     "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
    grid:     "M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z",
    award:    "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
    brief:    "M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2",
    user:     "M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z",
    gear:     "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z",
    bell:     "M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9",
    upload:   "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12",
    search:   "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
    clock:    "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z",
    check:    "M5 13l4 4L19 7",
    arrow:    "M13 7l5 5m0 0l-5 5m5-5H6",
    plus:     "M12 4v16m8-8H4",
    x:        "M6 18L18 6M6 6l12 12",
    mark:     "M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z",
    zap:      "M13 10V3L4 14h7v7l9-11h-7z",
    out:      "M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1",
    shield:   "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z",
    users:    "M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z",
  };
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={cls}>
      <path strokeLinecap="round" strokeLinejoin="round" d={p[n] || p.home} />
    </svg>
  );
};

/* ── LOGO ────────────────────────────────────────────────── */
const Logo = ({ white = false, sm = false }) => (
  <div className="flex items-center gap-2 cursor-pointer select-none">
    <svg width={sm ? 28 : 36} height={sm ? 28 : 36} viewBox="0 0 48 48" fill="none">
      <path d="M24 2L44 13.5V34.5L24 46L4 34.5V13.5L24 2Z" fill={white ? '#fff' : '#000'}/>
      <path d="M24 11L37 32H11L24 11Z" fill={white ? '#000' : '#fff'}/>
    </svg>
    <span className={`font-bold tracking-tight ${sm ? 'text-sm' : 'text-base'} ${white ? 'text-white' : 'text-black'}`}>SkillBridge</span>
  </div>
);

/* ── SHARED UI ───────────────────────────────────────────── */
const Cls = ({ lvl, lg = false }) => {
  const m = {
    D: 'bg-white text-black border border-black',
    C: 'bg-gray-200 text-gray-700',
    B: 'bg-black text-white',
    A: 'bg-black text-white border-l-2 border-amber-400',
  };
  return <span className={`inline-flex items-center font-bold tracking-widest uppercase rounded-sm text-xs px-2 py-0.5 ${m[lvl]} ${lg ? 'text-sm px-3 py-1' : ''}`}>{`CLASS ${lvl}`}</span>;
};

const Pill = ({ s }) => {
  const m = {
    'Completed':    'bg-green-100 text-green-800',
    'Passed':       'bg-green-100 text-green-800',
    'Failed':       'bg-red-100 text-red-800',
    'Declined':     'bg-red-100 text-red-800',
    'Pending':      'bg-amber-100 text-amber-800',
    'Under Review': 'bg-yellow-100 text-yellow-800',
    'In Progress':  'bg-gray-100 text-gray-800',
    'Expired':      'bg-gray-100 text-gray-500',
    'Open':         'bg-green-100 text-green-800',
  };
  const dot = {
    'Completed':'bg-green-500','Passed':'bg-green-500','Failed':'bg-red-500','Declined':'bg-red-500',
    'Pending':'bg-amber-500','Under Review':'bg-yellow-500','In Progress':'bg-black','Expired':'bg-gray-400','Open':'bg-green-500',
  };
  return (
    <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${m[s]||'bg-gray-100 text-gray-600'}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${dot[s]||'bg-gray-400'}`}/>
      {s}
    </span>
  );
};

const Btn = ({ children, v = 'primary', sz = 'md', onClick, disabled, cls = '' }) => {
  const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-lg btn-t cursor-pointer select-none';
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
  const vs = {
    primary:     'bg-black text-white hover:bg-gray-800 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed',
    secondary:   'bg-white text-black border border-black hover:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400',
    ghost:       'bg-transparent text-black hover:bg-gray-100',
    danger:      'bg-red-600 text-white hover:bg-red-700',
    white:       'bg-white text-black hover:bg-gray-100',
  };
  return <button className={`${base} ${sizes[sz]} ${vs[v]} ${cls}`} onClick={onClick} disabled={!!disabled}>{children}</button>;
};

const Card = ({ children, cls = '', hover = false, onClick }) => (
  <div className={`bg-white border border-gray-200 rounded-xl ${hover ? 'card-hover cursor-pointer' : ''} ${cls}`} onClick={onClick}>{children}</div>
);

const Av = ({ name, sz = 'md' }) => {
  const s = { sm: 'w-8 h-8 text-xs', md: 'w-10 h-10 text-sm', lg: 'w-16 h-16 text-xl' };
  const ini = (name||'SB').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  return <div className={`${s[sz]} rounded-full bg-black text-white flex items-center justify-center font-bold flex-shrink-0`}>{ini}</div>;
};

const Bar = ({ val, max = 100 }) => {
  const pct = Math.min(100, Math.round((val/max)*100));
  return <div className="w-full bg-gray-200 rounded-full h-2"><div className="bg-black h-2 rounded-full progress-bar" style={{width:`${pct}%`}}/></div>;
};

/* ── PUBLIC NAV ──────────────────────────────────────────── */
const PubNav = ({ go }) => (
  <nav className="sticky top-0 z-50 bg-white border-b border-gray-200">
    <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div onClick={()=>go('landing')}><Logo/></div>
      <div className="hidden md:flex items-center gap-8 text-sm text-gray-500">
        {['How It Works','For Graduates','For Employers','Pricing'].map(l=><button key={l} className="hover:text-black transition-colors">{l}</button>)}
      </div>
      <div className="flex gap-3">
        <Btn v="ghost" onClick={()=>go('login')}>Log In</Btn>
        <Btn onClick={()=>go('register')}>Get Started</Btn>
      </div>
    </div>
  </nav>
);

/* ── APP SHELL ───────────────────────────────────────────── */
const Shell = ({ children, go, page, user }) => {
  const nav = [
    { id:'dashboard',    label:'Dashboard',    icon:'home'  },
    { id:'challenges',   label:'Challenges',   icon:'grid'  },
    { id:'credentials',  label:'Credentials',  icon:'award' },
    { id:'projects',     label:'Project Board',icon:'brief' },
    { id:'profile',      label:'My Profile',   icon:'user'  },
    { id:'settings',     label:'Settings',     icon:'gear'  },
  ];
  const titles = { dashboard:'Dashboard', challenges:'Challenges', credentials:'My Credentials', projects:'Project Board', profile:'My Profile', settings:'Settings', challenge_detail:'Challenge Detail', active_challenge:'Active Challenge' };
  return (
    <div className="flex h-screen bg-gray-50 overflow-hidden">
      <aside className="hidden md:flex flex-col w-60 bg-white border-r border-gray-200 flex-shrink-0">
        <div className="p-5 border-b border-gray-200"><Logo/></div>
        <div className="p-4 border-b border-gray-200 flex items-center gap-3">
          <Av name={user.name} sz="sm"/>
          <div className="min-w-0"><p className="text-sm font-semibold truncate">{user.name}</p><Cls lvl={user.cls}/></div>
        </div>
        <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto">
          {nav.map(item=>(
            <button key={item.id} onClick={()=>go(item.id)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium nav-item ${page===item.id?'bg-black text-white':'text-gray-600 hover:bg-gray-100 hover:text-black'}`}>
              <Ico n={item.icon} s={18}/>{item.label}
            </button>
          ))}
        </nav>
        {!user.premium&&(
          <div className="p-4 border-t border-gray-200">
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
              <p className="text-xs font-bold text-amber-800">⭐ Go Premium</p>
              <p className="text-xs text-amber-700 mt-0.5">Get discovered faster by employers</p>
              <button className="mt-2 w-full bg-black text-white text-xs font-semibold py-1.5 rounded-lg">Upgrade — 1,500 XAF/mo</button>
            </div>
          </div>
        )}
        <div className="p-3 border-t border-gray-200">
          <button onClick={()=>go('landing')} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-red-600 nav-item">
            <Ico n="out" s={18}/>Log Out
          </button>
        </div>
      </aside>
      <div className="flex-1 flex flex-col overflow-hidden">
        <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
          <h1 className="text-lg font-semibold capitalize">{titles[page]||page}</h1>
          <div className="flex items-center gap-3">
            <button className="relative p-2 rounded-lg hover:bg-gray-100"><Ico n="bell" s={20}/><span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"/></button>
            <button onClick={()=>go('profile')} className="p-1 rounded-lg hover:bg-gray-100"><Av name={user.name} sz="sm"/></button>
          </div>
        </header>
        <main className="flex-1 overflow-y-auto p-6 fade-in">{children}</main>
      </div>
    </div>
  );
};

/* ══ PAGES ══════════════════════════════════════════════════ */

/* Landing */

        <div className="flex flex-wrap gap-3 mb-5">

          <div className="flex gap-2 mb-3"><Cls lvl="A"/><span className="text-xs font-semibold text-green-700 bg-green-100 px-2 py-0.5 rounded-full">Top 8%</span></div>
          <Bar val={100}/>
        </Card>
        <Card cls="absolute top-24 right-0 w-64 p-4 shadow-xl" style={{transform:'rotate(2deg)'}}>
          <div className="flex justify-between mb-2"><span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Badge Earned</span><Pill s="Completed"/></div>

          <div className="flex gap-2 mt-2"><Cls lvl="B"/><span className="text-xs text-gray-400">Score: 88/100</span></div>

    </section>

    <section className="bg-gray-50 border-y border-gray-200">
      <div className="max-w-7xl mx-auto px-6 py-6 grid grid-cols-2 md:grid-cols-4 gap-6 divide-x divide-gray-200">
        {[['10,000+','Registered Graduates'],['320','Practice Challenges'],['4','Academic Fields'],['99.5%','Platform Uptime']].map(([n,l])=>(
          <div key={l} className="text-center px-4"><p className="font-mono text-2xl font-bold">{n}</p><p className="text-xs text-gray-500 mt-1">{l}</p></div>
        ))}
      </div>
    </section>

    <section className="max-w-7xl mx-auto px-6 py-20">
      <div className="text-center mb-12">
        <span className="text-xs font-bold uppercase tracking-widest text-gray-400">HOW IT WORKS</span>
        <h2 className="text-3xl font-bold mt-3">Four classes. One path. Real proof.</h2>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {[{c:'D',n:'Beginner',d:'Start here. Complete 5 challenges to progress.',r:'AI Reviewed'},{c:'C',n:'Intermediate',d:'4 challenges. Deeper domain knowledge required.',r:'AI Reviewed'},{c:'B',n:'Advanced',d:'Expert-reviewed. Complex multi-part deliverables.',r:'Expert Reviewed'},{c:'A',n:'Expert',d:'Access paid real-world projects from companies.',r:'Expert Reviewed'}].map(x=>(
          <Card key={x.c} cls="p-5">

            <span className="text-xs text-gray-400 border-t border-gray-100 pt-3 block">{x.r}</span>
          </Card>
        ))}
      </div>

    <section className="bg-black">

        <div className="flex gap-8 text-sm text-gray-500">
          {['How It Works','Pricing','Privacy','Terms','Contact'].map(l=><a key={l} href="#" className="hover:text-black">{l}</a>)}
        </div>
        <p className="text-sm text-gray-400">© 2026 SkillBridge · Cameroon</p>
      </div>

/* Login */
const Login = ({ go }) => (
  <div className="min-h-screen flex">

      <Logo white/>
      <div className="flex-1 flex flex-col justify-center">

        <Card cls="p-5 !bg-gray-900 !border-gray-700">
          <div className="flex items-center gap-3 mb-3"><Av name="Thierry N"/><div><p className="text-white font-semibold text-sm">Thierry Ngong</p><p className="text-gray-400 text-xs">Computer Engineering</p></div></div>
          <Cls lvl="A"/>
          <div className="flex gap-2 mt-3">{['SQL Design','Data Structures','API Build'].map(b=><span key={b} className="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded-md">{b}</span>)}</div>

    <div className="flex-1 flex items-center justify-center p-8 bg-white">

          <div><label className="text-sm font-medium block mb-1.5">Password</label><input type="password" placeholder="••••••••" className="w-full h-11 px-4 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black focus:ring-2 focus:ring-black/5"/></div>
